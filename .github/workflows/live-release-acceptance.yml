name: Live beta.11 acceptance
on:
  push:
    branches: [beta11-release-acceptance]
permissions:
  contents: read
jobs:
  teacher-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: google-chrome --version || npx playwright install --with-deps chromium
      - run: node --test tests/live-release-acceptance.cjs
