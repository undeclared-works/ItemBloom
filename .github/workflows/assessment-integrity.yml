name: Assessment file integrity
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'save-guard.js'
      - 'drafts.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/assessment-integrity.yml'
  push:
    branches: [beta11-file-integrity]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/assessment-integrity.test.cjs
